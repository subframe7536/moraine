name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - '.node-version'
      - 'package.json'
      - 'nub.jsonc'
      - 'nub.lock'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/CI.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - '.node-version'
      - 'package.json'
      - 'nub.jsonc'
      - 'nub.lock'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/CI.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: nubjs/setup-nub@v0
        with:
          cache: true
          cache-dependency-path: |
            package.json
            nub.lock
            nub.jsonc

      - run: nub ci

      - run: nub run qa

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: nubjs/setup-nub@v0
        with:
          cache: true
          cache-dependency-path: |
            package.json
            nub.lock
            nub.jsonc

      - run: nub ci

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            if git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
              nub run test --changed "origin/$BASE_REF"
            else
              nub run test --changed "$BASE_REF"
            fi
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "${{ github.event.before }}" >/dev/null 2>&1; then
            nub run test --changed ${{ github.event.before }}
          else
            nub run test
          fi
