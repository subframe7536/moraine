name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'docs/**'
      - 'test/**'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/CI.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'docs/**'
      - 'test/**'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/CI.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - run: pnpm run qa
      - name: Ensure QA fixes are committed
        run: git diff --exit-code

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - name: Run changed tests
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && git rev-parse --verify "origin/$BASE_REF^{commit}" >/dev/null 2>&1; then
            pnpm run test:lib --changed "origin/$BASE_REF"
            pnpm run test:docs --changed "origin/$BASE_REF"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            pnpm run test:lib --changed "$BEFORE"
            pnpm run test:docs --changed "$BEFORE"
          else
            pnpm run test:lib
            pnpm run test:docs
          fi

      - run: pnpm run docs:build
