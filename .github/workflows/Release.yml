name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.7.5

      - run: nub ci
      - run: nub publish --provenance --no-git-checks
      - name: Trigger Cloudflare Pages build
        run: curl -d "" ${PAGES_BUILD_HOOK_URL}
        env:
          PAGES_BUILD_HOOK_URL: ${{ secrets.PAGES_BUILD_HOOK_URL }}
      - run: nubx changelogithub -y
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
