name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: bun install -g npm@latest

      - run: bun ci
      - run: bun run verify
      - run: git diff --exit-code -- docs/pages
      - run: npm publish
      - name: Trigger Cloudflare Pages build
        run: curl -d "" ${PAGES_BUILD_HOOK_URL}
        env:
          PAGES_BUILD_HOOK_URL: ${{ secrets.PAGES_BUILD_HOOK_URL }}
      - run: bunx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
